<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-labelledby="title description">
  <title id="title">Villa Vessela light logo</title>
  <desc id="description">Light-color Villa Vessela wordmark with three individual sampaguita flowers above the VV and three below.</desc>
  <defs>
    <g id="sampaguita" fill="#ffffff" stroke="#d8c18f" stroke-width="0.75">
      <ellipse cy="-3.3" rx="2.55" ry="3.55"/>
      <ellipse cy="-3.3" rx="2.55" ry="3.55" transform="rotate(72)"/>
      <ellipse cy="-3.3" rx="2.55" ry="3.55" transform="rotate(144)"/>
      <ellipse cy="-3.3" rx="2.55" ry="3.55" transform="rotate(216)"/>
      <ellipse cy="-3.3" rx="2.55" ry="3.55" transform="rotate(288)"/>
      <circle r="1.35" fill="#d9b568" stroke="none"/>
    </g>
    <g id="emblem">
      <circle cx="64" cy="64" r="59" fill="#083d54" stroke="#ffffff" stroke-width="2"/>
      <circle cx="64" cy="64" r="54" fill="none" stroke="#d9b568" stroke-width="1.5"/>
      <use href="#sampaguita" transform="translate(42 28) rotate(-24) scale(0.76)"/>
      <use href="#sampaguita" transform="translate(64 18.5) rotate(7) scale(0.88)"/>
      <use href="#sampaguita" transform="translate(86 28) rotate(29) scale(0.72)"/>
      <path d="M29 38 51 87 65 56" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
      <path d="m51 38 22 49 25-49" fill="none" stroke="#d9b568" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
      <use href="#sampaguita" transform="translate(42 100) rotate(24) scale(0.76)"/>
      <use href="#sampaguita" transform="translate(64 109.5) rotate(-7) scale(0.88)"/>
      <use href="#sampaguita" transform="translate(86 100) rotate(-29) scale(0.72)"/>
    </g>
  </defs>

  <use href="#emblem" transform="translate(7 9) scale(0.796875)" aria-hidden="true"/>
  <text x="124" y="58" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" letter-spacing="2.6">VILLA VESSELA</text>
  <path d="M125 70h292" stroke="#d9b568" stroke-width="1"/>
  <text x="125" y="88" fill="#d9ebe7" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.2">BEACHFRONT • TONDOL BEACH</text>
</svg>
